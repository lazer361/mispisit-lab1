name: mispisit-bezdnyakov-a

services:
  app:
    image: lazer361/mispisit-lab1:0.0.4
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "db", "-U", "app", "-d", "app"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: