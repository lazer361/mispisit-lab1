{% extends "base.html" %}

{% block content %}
<h2>Создание короткой ссылки</h2>

{% if error %}
<p class="error" role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('create_link') }}">
    <p>
        <label for="original_url">Исходный URL</label>
        <input id="original_url" name="original_url" type="url"
               placeholder="https://example.org/" value="{{ original_url|default('') }}" required>
    </p>
    <p>
        <label for="title">Название (необязательно)</label>
        <input id="title" name="title" type="text" maxlength="255" value="{{ title|default('') }}">
    </p>
    <button type="submit">Создать</button>
</form>
{% endblock %}
